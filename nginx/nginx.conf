events {}

http {
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;

    # Any service that deliberately joins `tailscale-ingress` can publish a
    # webhook without changing this file. Its Docker network alias supplies
    # the hostname in `/hooks/<alias>/...`; the full path is kept intact for
    # application-level routing and webhook registration.
    location ~ "^/hooks/(?<backend>[a-z0-9][a-z0-9-]{0,62})(?:/|$)" {
      set $template_upstream http://$backend:8080$request_uri;
      proxy_pass $template_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Generic application namespace. It follows the same Docker alias
    # convention as /hooks but is intended for interactive web applications.
    location ~ "^/apps/(?<backend>[a-z0-9][a-z0-9-]{0,62})(?:/|$)" {
      set $template_upstream http://$backend:8080$request_uri;
      proxy_pass $template_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }
  }
}
