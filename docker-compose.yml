services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: tailscale-gateway
    hostname: ${TS_HOSTNAME:-apps-gateway}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      # When state is persisted, authenticate only a previously unregistered node.
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_HOSTNAME: ${TS_HOSTNAME:-apps-gateway}
      TS_USERSPACE: "true"
    volumes:
      - ./state:/var/lib/tailscale
      - tailscale-socket:/var/run/tailscale
    networks:
      - tailscale-ingress
    healthcheck:
      test:
        - CMD-SHELL
        - tailscale status --peers=false >/dev/null 2>&1 && tailscale ip -4 >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  proxy:
    image: nginx:1.27-alpine
    container_name: tailscale-gateway-proxy
    restart: unless-stopped
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  watchdog:
    build:
      context: ./watchdog
    container_name: tailscale-funnel-watchdog
    restart: unless-stopped
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_healthy
      proxy:
        condition: service_started
    environment:
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      WATCHDOG_INTERVAL_SECONDS: ${WATCHDOG_INTERVAL_SECONDS:-60}
      WATCHDOG_FAILURE_THRESHOLD: ${WATCHDOG_FAILURE_THRESHOLD:-3}
      WATCHDOG_RECOVERY_ENABLED: ${WATCHDOG_RECOVERY_ENABLED:-true}
      WATCHDOG_RECOVERY_COOLDOWN_SECONDS: ${WATCHDOG_RECOVERY_COOLDOWN_SECONDS:-3600}
      WATCHDOG_SOFT_RECOVERY_WAIT_SECONDS: ${WATCHDOG_SOFT_RECOVERY_WAIT_SECONDS:-120}
      WATCHDOG_RECOVERY_WAIT_SECONDS: ${WATCHDOG_RECOVERY_WAIT_SECONDS:-600}
      WATCHDOG_DNS_RESOLVERS: ${WATCHDOG_DNS_RESOLVERS:-1.1.1.1 8.8.8.8}
      WATCHDOG_LOCAL_URL: ${WATCHDOG_LOCAL_URL:-http://127.0.0.1:8080/healthz}
      WATCHDOG_PUBLIC_PATH: ${WATCHDOG_PUBLIC_PATH:-/healthz}
      WATCHDOG_FUNNEL_TARGET: ${WATCHDOG_FUNNEL_TARGET:-http://127.0.0.1:8080}
      WATCHDOG_FUNNEL_PORT: ${WATCHDOG_FUNNEL_PORT:-443}
    volumes:
      - tailscale-socket:/var/run/tailscale:ro
      - watchdog-data:/var/lib/funnel-watchdog

networks:
  tailscale-ingress:
    name: tailscale-ingress

volumes:
  tailscale-socket:
  watchdog-data:
